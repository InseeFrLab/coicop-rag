apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: run-rag-
spec:
  entrypoint: run-rag

  # Arguments that can be overridden at submission time
  arguments:
    parameters:
      - name: config
        value: config/config.yaml
      - name: sample_size
        value: ""
      - name: model-name
        value: ""

  templates:
    - name: run-rag
      inputs:
        parameters:
          - name: config
          - name: sample_size
          - name: model-name
      container:
        image: inseefrlab/onyxia-vscode-python:py3.13.12
        command: [sh, -c]
        args:
          - |
            set -e
            mkdir -p logs prompts

            ARGS="--config {{inputs.parameters.config}}"

            if [ -n "{{inputs.parameters.sample_size}}" ]; then
              ARGS="$ARGS --sample_size {{inputs.parameters.sample_size}}"
            fi

            if [ -n "{{inputs.parameters.model-name}}" ]; then
              ARGS="$ARGS --model-name {{inputs.parameters.model-name}}"
            fi

            uv run scripts/3_run_rag.py $ARGS

        env:
          # Langfuse
          - name: LANGFUSE_BASE_URL
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: LANGFUSE_BASE_URL
          - name: LANGFUSE_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: LANGFUSE_PUBLIC_KEY
          - name: LANGFUSE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: LANGFUSE_SECRET_KEY

          # MLflow
          - name: MLFLOW_TRACKING_URI
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: MLFLOW_TRACKING_URI
          - name: MLFLOW_TRACKING_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: MLFLOW_TRACKING_USERNAME
          - name: MLFLOW_TRACKING_PASSWORD
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: MLFLOW_TRACKING_PASSWORD

          # Ollama
          - name: OLLAMA_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: OLLAMA_API_KEY
          - name: OLLAMA_URL
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: OLLAMA_URL

          # Qdrant
          - name: QDRANT_URL
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: QDRANT_URL
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: QDRANT_API_KEY
          - name: QDRANT_API_PORT
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: QDRANT_API_PORT

          # vLLM embedding
          - name: VLLM_EMBEDDING_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: VLLM_EMBEDDING_API_KEY
          - name: VLLM_EMBEDDING_URL
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: VLLM_EMBEDDING_URL

          # vLLM generation
          - name: VLLM_GENERATION_API_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: VLLM_GENERATION_API_KEY
          - name: VLLM_GENERATION_URL
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: VLLM_GENERATION_URL

          # S3 / AWS
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: AWS_SESSION_TOKEN

          # Misc
          - name: DDC_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: secret-rag
                key: DDC_ENCRYPTION_KEY

        resources:
          requests:
            memory: 2Gi
            cpu: 100m
          limits:
            memory: 50Gi
            cpu: 15000m
