# config.yaml
qdrant:
  collection_name: "coicop_lineage"
  upload_batch_size: 56

embedding:
  model_name: "qwen3-embedding:8b"
  model_len: 4096

retrieval:
  size: 10

llm:
  prompt_name: prompt-multi-level
  prompt_version: "8"
  model_name: gpt-oss:120b
  temperature: 0.1
  max_tokens: 256

coicop:
  path_raw: "s3://projet-budget-famille/data/coicop-2018_envoi_rmes_20251022.csv"
  path_prunned_lvl4: "s3://projet-budget-famille/data/coicop-2018_envoi_rmes_20251022_prunned_lvl4.parquet"
  path_mapping_lvl4: "s3://projet-budget-famille/data/coicop-2018_envoi_rmes_20251022_mapping_prunning_lvl4.parquet"

annotations:
  s3_path: "s3://projet-budget-famille/data/output-annotation-consolidated-2026-01-05/raw.parquet"
  sample_size: 8
  nature: manual_from_books

predictions:
  s3_path: "s3://projet-budget-famille/data/rag/predictions_{timestamp}.parquet"
  s3_path_retrieved_codes: "s3://projet-budget-famille/data/rag/retrieved_codes_{timestamp}.parquet"

eval:
  threshold_confidence: 0.7
  rules_path: src/eval/rules.yaml

mlflow:
  experiment_name: rag-coicop